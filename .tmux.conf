# GNU Screen-like tmux configuration
# Use C-a as prefix key (like screen) instead of default C-b
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable 256 color terminal support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Screen-like window switching
# C-a c - create new window
bind c new-window

# C-a n - next window  
bind n next-window

# C-a p - previous window
bind p previous-window

# C-a C-a - last window (toggle between current and previous)
bind C-a last-window

# C-a A - rename window (like screen's C-a A)
bind A command-prompt -p "rename window to:" "rename-window '%%'"

# C-a " - list all windows (like screen's C-a ")
bind '"' choose-window

# C-a k - kill current window (like screen's C-a k)
bind k confirm-before -p "kill-window #W? (y/n)" kill-window

# C-a d - detach from session (like screen's C-a d)
bind d detach-client

# Screen-like pane splitting
# C-a S - split window horizontally (screen's horizontal split)
bind S split-window -v

# C-a | - split window vertically  
bind | split-window -h

# C-a tab - switch between panes (like screen's C-a tab)
bind Tab select-pane -t :.+

# C-a x - kill current pane
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Screen-like copy mode
# C-a [ - enter copy mode (like screen's C-a [)
bind [ copy-mode

# C-a ] - paste (like screen's C-a ])
bind ] paste-buffer

# Window numbering starts at 1 (like screen)
set -g base-index 1
set -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Enable mouse support (optional, screen doesn't have this by default)
set -g mouse on
set-option -s set-clipboard off

# Enable middle-click paste from Windows clipboard
bind-key -n MouseDown2Pane run-shell "powershell.exe Get-Clipboard | tmux load-buffer - && tmux paste-buffer"

# Increase scrollback buffer size
set -g history-limit 10000

# Display time for status messages
set -g display-time 2000

# Faster command sequences
set -s escape-time 0

# Screen-like status bar
set -g status-bg black
set -g status-fg white
set -g status-left-length 30
set -g status-right-length 60
set -g status-left '#[fg=green]#S#[default] '
set -g status-right '#[fg=yellow]#(whoami)@#H#[default] #[fg=blue]%H:%M %d-%b-%y#[default]'

# Window status format (similar to screen)
setw -g window-status-format '#I:#W#F'
setw -g window-status-current-format '#[fg=black,bg=white]#I:#W#F#[default]'

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Pane border colors
set -g pane-border-style fg=black
set -g pane-active-border-style fg=white

# Message colors
set -g message-style bg=black,fg=white

# Additional useful bindings
# C-a r - reload config file
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# C-a ? - show key bindings (default tmux help)
# This is already bound by default

# Screen-like window switching with numbers
bind 0 select-window -t 0
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Enable vi-style key bindings in copy mode
setw -g mode-keys vi

# Copy mode: vi-style selection + Windows clipboard via clip.exe (WSL)
# Enter copy mode with C-a [, then:
#   v     - begin selection
#   y     - yank selection to Windows clipboard
#   Enter - yank selection to Windows clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"

# Mouse drag in copy mode also copies to Windows clipboard
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# Screen-like region/pane selection
# C-a Q - show pane numbers (like screen's C-a Q)
bind Q display-panes

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Automatically name new sessions after their starting directory
set-hook -g after-new-session 'rename-session "#{b:session_path}"'

